<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>room</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud">
    <div id="signature"></div>
    <nav id="shots" aria-label="camera shots"></nav>
    <button id="sound">sound: off</button>
    <div id="radio-bar"><button id="radio" aria-pressed="false">radio</button><button id="radio-next" hidden aria-label="next track">›</button></div>
  </div>
  <div id="tooltip" role="status" aria-live="polite"></div>
  <div id="loading" aria-hidden="true"><span></span></div>
  <div id="enter"><button>enter the room</button><p>1–9 or ← → to look around · Esc to step back</p></div>
  <main id="fallback"></main>
  <button id="view" hidden><span data-view="lofi">LOFI</span> <span data-view="hifi">HIFI</span></button>
  <noscript>This room needs JavaScript. The links are on github.com/piabrota.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
