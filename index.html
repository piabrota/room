<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>room</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="live" hidden></div>
  <canvas id="scene"></canvas>
  <div id="hud">
    <div id="top">
      <div id="signature"></div>
      <div id="controls">
        <div id="switches">
          <button id="window-live" hidden aria-pressed="false"></button>
          <button id="rain" aria-pressed="false">rain: off</button>
          <button id="daylight" aria-pressed="false">night</button>
          <button id="sound">sound: off</button>
        </div>
        <div id="radio-bar">
          <button id="radio" aria-pressed="false">radio</button>
          <button id="radio-next" hidden aria-label="next track">›</button>
          <button id="playlist" hidden></button>
        </div>
        <a id="live-credit" hidden target="_blank" rel="noopener"></a>
        <div id="radio-more" hidden>
          <div id="stations" role="group" aria-label="stations"></div>
          <span id="listeners" hidden></span>
        </div>
      </div>
    </div>
    <div id="bottom">
      <nav id="shots" aria-label="camera shots"></nav>
      <button id="credits" hidden></button>
      <div id="credits-card" role="region"></div>
    </div>
  </div>
  <div id="player" role="dialog" aria-modal="false" hidden></div>
  <div id="lock" role="dialog" aria-modal="false" hidden></div>
  <div id="tooltip" role="status" aria-live="polite"></div>
  <div id="loading" aria-hidden="true"><span></span></div>
  <div id="enter"><button>enter the room</button><p>1–9, 0 or ← → to look around · Esc to step back</p></div>
  <main id="fallback"></main>
  <div id="view" role="group" aria-label="view" hidden><button data-view="lofi" title="the room as text">LOFI</button><button data-view="hifi" title="the 3D room, with sound">HIFI</button></div>
  <noscript>This room needs JavaScript. The links are on github.com/piabrota.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
